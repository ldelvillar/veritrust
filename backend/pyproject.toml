[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veritrust"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.135",
    "uvicorn[standard]>=0.41",
    "python-multipart>=0.0.22",
    "python-dotenv>=1.2",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "httpx>=0.28",
    # Auth
    "PyJWT>=2.12",
    "cryptography>=46",
    # Database
    "psycopg[binary,pool]>=3.2",
    # Background job queue + rate limiting
    "arq>=0.26",
    "redis>=5",
    # LLM / Agents
    "langchain>=1.2",
    "langchain-core>=1.2",
    "langchain-ollama>=1.0",
    "langchain-mistralai>=1.1",
    "langgraph>=1.0",
    "ollama>=0.6",
    # ML inference (serving runs BERT; torch llega por el grupo por defecto 'cpu')
    "transformers>=5.2",
    "numpy>=2.4",
    # Web scraping
    "beautifulsoup4>=4.14",
    "requests>=2.32",
    # Utilities
    "PyYAML>=6.0",
    "orjson>=3.11",
    "pypdf>=5",
]

[project.optional-dependencies]
# Full ML stack. Install with: uv sync --extra ml
ml = [
    "scikit-learn>=1.8",
    "pandas>=3.0",
    "pyarrow>=23",
    "accelerate>=1.12",
    "matplotlib>=3.10",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1",
    "coverage>=7.13",
    "ruff>=0.8",
    "mypy>=1.13",
    "fakeredis>=2",
]
# Torch por defecto (CPU). Grupo activo salvo que se pida el de GPU.
cpu = ["torch>=2.10"]
# CUDA torch para entrenar en la GPU local: uv sync --extra ml --no-group cpu --group gpu
gpu = ["torch>=2.10; sys_platform != 'darwin'"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

# Pull the CPU-only torch build; the default wheel bundles ~5GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# cu126 is the last CUDA flavor with Pascal (sm_61) kernels for the local MX350.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", group = "gpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", group = "cpu" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "db: pruebas contra un PostgreSQL real (requieren Docker o TEST_DATABASE_URL)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ml*"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", "models", "results", "data", "**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]  # line length is enforced by the formatter

[tool.ruff.lint.per-file-ignores]
# These modules manipulate sys.path before importing app/ml so the file can
# also be executed as a script. The imports below the sys.path block are
# intentional, not lint violations.
"app/agents/main.py" = ["E402"]
"app/agents/health_expert.py" = ["E402"]
"ml/evaluation/evaluate_factcheck.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["app", "ml"]
exclude = "(^|/)(\\.venv|models|results|data|tests)(/|$)"
