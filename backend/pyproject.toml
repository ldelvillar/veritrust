[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veritrust"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28",
    # Auth
    "PyJWT>=2.12",
    "cryptography>=50.0.1",
    # Database
    "psycopg[binary,pool]>=3.3.6",
    # Background job queue + rate limiting
    "arq>=0.26",
    "redis>=5",
    # LLM / Agents
    "langchain>=1.4.2",
    "langchain-core>=1.2",
    "langchain-ollama>=1.1.0",
    "langchain-mistralai>=1.1",
    "langchain-groq>=1.0",
    "langchain-google-genai>=2.1",
    "langchain-nvidia-ai-endpoints>=1.0",
    "langgraph>=1.0",
    "ollama>=0.6.2",
    # Web scraping
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    # Utilities
    "PyYAML>=6.0",
    "orjson>=3.12.0",
    "pypdf>=6.19.0",
    "mcp>=2.2",
]

[project.optional-dependencies]
# Data deps of the eval harness (pyarrow reads the HealthVer parquet splits). Install with: uv sync --extra ml
ml = [
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1",
    "coverage>=7.16.1",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "fakeredis>=2.38.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "db: pruebas contra un PostgreSQL real (requieren Docker o TEST_DATABASE_URL)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ml*"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", "models", "results", "data", "**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]  # line length is enforced by the formatter

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["app", "ml"]
exclude = "(^|/)(\\.venv|models|results|data|tests)(/|$)"

[[tool.mypy.overrides]]
module = "app.agents.*"
disallow_untyped_defs = true
