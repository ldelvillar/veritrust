name: CI

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - docker-compose*.yml
      - Caddyfile
      - .github/workflows/deploy.yml
      - .github/workflows/ci.yml
  # Sin filtro de rutas: el check requerido "CI passed" debe reportar en todo PR.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend_app: ${{ steps.filter.outputs.backend_app }}
      backend_evaluation: ${{ steps.filter.outputs.backend_evaluation }}
      backend_image: ${{ steps.filter.outputs.backend_image }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend_app:
              - 'backend/app/**'
              - 'backend/uv.lock'
              - 'backend/pyproject.toml'
              - '.github/workflows/ci.yml'
            backend_evaluation:
              - 'backend/evaluation/**'
              - 'backend/data/**'
              - 'backend/uv.lock'
              - 'backend/pyproject.toml'
              - '.github/workflows/ci.yml'
            backend_image:
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
              - 'backend/app/**'
              - 'backend/db/**'
              - 'backend/uv.lock'
              - 'backend/pyproject.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend_app:
    name: Backend App Tests (Python)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend_app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CORS_ALLOWED_ORIGINS: "http://localhost"
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check app evaluation tests

      - name: Format check (ruff)
        run: uv run ruff format --check app evaluation tests

      - name: Type check (mypy)
        run: uv run mypy

      - name: Run app tests with coverage
        run: |
          mkdir -p test-results
          uv run pytest -q tests \
            --junitxml=test-results/pytest.xml \
            --cov=app \
            --cov-fail-under=80 \
            --cov-report=term-missing \
            --cov-report=xml:test-results/coverage.xml \
            --cov-report=html:test-results/htmlcov

      - name: Upload backend app test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-app-test-results
          path: |
            backend/test-results/pytest.xml
            backend/test-results/coverage.xml
            backend/test-results/htmlcov
          if-no-files-found: warn

  backend_evaluation:
    name: Backend Evaluation Tests (Python)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend_evaluation == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra evaluation

      - name: Lint (ruff)
        run: uv run ruff check app evaluation tests

      - name: Format check (ruff)
        run: uv run ruff format --check app evaluation tests

      - name: Type check (mypy)
        run: uv run mypy

      - name: Run evaluation tests with coverage
        run: |
          mkdir -p test-results
          uv run pytest -q evaluation/tests \
            --junitxml=test-results/pytest-evaluation.xml \
            --cov=evaluation \
            --cov-fail-under=80 \
            --cov-report=term-missing \
            --cov-report=xml:test-results/coverage-evaluation.xml \
            --cov-report=html:test-results/htmlcov-evaluation

      - name: Upload backend evaluation test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-evaluation-test-results
          path: |
            backend/test-results/pytest-evaluation.xml
            backend/test-results/coverage-evaluation.xml
            backend/test-results/htmlcov-evaluation
          if-no-files-found: warn

  frontend:
    name: Frontend (Next.js)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Format check (prettier)
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder

  frontend_e2e:
    name: Frontend e2e (Playwright)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Instancia de desarrollo de Clerk: el usuario de prueba inicia sesión de verdad.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: warn

  api_contract:
    name: API contract (frontend types in sync)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend_app == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      CORS_ALLOWED_ORIGINS: "http://localhost"
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Dump OpenAPI schema
        working-directory: backend
        run: uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > "$RUNNER_TEMP/openapi.json"

      - name: Regenerate API types from schema
        working-directory: frontend
        run: pnpm exec openapi-typescript "$RUNNER_TEMP/openapi.json" -o src/types/api.d.ts

      - name: Verify committed types match the OpenAPI schema
        run: |
          git diff --exit-code -- frontend/src/types/api.d.ts || {
            echo "::error::frontend/src/types/api.d.ts is out of sync with the backend OpenAPI schema. Run 'pnpm --dir frontend generate:api-types' against a running backend and commit the result."
            exit 1
          }

  docker_images:
    name: Docker images (build)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend_image == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend_image == 'true'
        uses: docker/build-push-action@v7
        with:
          context: backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: frontend
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ci_placeholder
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  ci_ok:
    name: CI passed
    needs:
      [
        changes,
        backend_app,
        backend_evaluation,
        frontend,
        frontend_e2e,
        api_contract,
        docker_images,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Algún job de CI falló o se canceló; no se despliega."
          exit 1

      - name: Report
        run: echo "CI en verde. Los jobs no aplicables a este cambio se omitieron."
