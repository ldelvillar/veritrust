name: CI

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - docker-compose*.yml
      - Caddyfile
      - .github/workflows/deploy.yml
      - .github/workflows/ci.yml
  # No path filter, since the required "CI passed" check must report on every PR.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend_app: ${{ steps.filter.outputs.backend_app }}
      backend_evaluation: ${{ steps.filter.outputs.backend_evaluation }}
      pipeline_code: ${{ steps.filter.outputs.pipeline_code }}
      gold_set: ${{ steps.filter.outputs.gold_set }}
      backend_image: ${{ steps.filter.outputs.backend_image }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy_config: ${{ steps.filter.outputs.deploy_config }}
      uncovered: ${{ steps.coverage.outputs.uncovered }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: json
          filters: |
            backend_app:
              - 'backend/app/**'
              - 'backend/db/**'
              - 'backend/tests/**'
              - 'backend/conftest.py'
              - 'backend/uv.lock'
              - 'backend/pyproject.toml'
              - 'backend/.python-version'
              - '.github/workflows/ci.yml'
            backend_evaluation:
              - 'backend/evaluation/**'
              - 'backend/data/**'
              - 'backend/conftest.py'
              - 'backend/uv.lock'
              - 'backend/pyproject.toml'
              - 'backend/.python-version'
              - '.github/workflows/ci.yml'
            # Code that can move a Verdict on the gold set, which the eval gate re-measures against main.
            pipeline_code:
              - 'backend/app/agents/**'
              - 'backend/app/prompts/**'
              - 'backend/app/core/claim.py'
              - 'backend/app/core/verdict.py'
              - 'backend/app/utils/llm.py'
              - 'backend/app/utils/evidence.py'
              - 'backend/app/utils/pubmed.py'
              - 'backend/app/utils/europepmc.py'
              - 'backend/app/utils/openfda.py'
              - 'backend/app/utils/cima.py'
              - 'backend/evaluation/evaluate_pipeline.py'
              - 'backend/evaluation/eval_gate.py'
              - 'backend/evaluation/load_data.py'
            gold_set:
              - 'backend/data/gold_es.jsonl'
            backend_image:
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
              - 'backend/app/**'
              - 'backend/db/**'
              - 'backend/uv.lock'
              - 'backend/pyproject.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            deploy_config:
              - 'docker-compose*.yml'
              - 'Caddyfile'
              - '.github/workflows/**'
            # Files that ship nowhere, so no job has to cover them.
            not_deployed:
              - '**/*.md'
              - '**/.gitignore'
              - '**/.env.example'

      # The push trigger's paths decide what reaches deploy.yml, so they are read here rather than copied.
      - name: Read the push trigger's paths
        id: push_paths
        run: |
          paths=$(yq -o json -I0 '.on.push.paths // []' .github/workflows/ci.yml)
          # paths-filter reads '!' patterns differently from GitHub, so only a plain positive list is safe to reuse.
          if ! jq -e 'length > 0 and all(.[]; type == "string" and (startswith("!") | not))' <<<"$paths" >/dev/null; then
            echo "::error::on.push.paths debe ser una lista de patrones positivos para calcular la cobertura; adapta este paso si cambias el trigger."
            exit 1
          fi
          {
            echo 'filters<<EOF'
            jq -r '"deploy_relevant:", (.[] | "  - " + @json)' <<<"$paths"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Filter deploy-relevant paths
        id: relevant
        uses: dorny/paths-filter@v4
        with:
          list-files: json
          filters: ${{ steps.push_paths.outputs.filters }}

      - name: Find deploy-relevant files that no filter covers
        id: coverage
        env:
          FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
          RELEVANT: ${{ steps.relevant.outputs.deploy_relevant_files }}
        run: |
          uncovered=$(jq -c --argjson relevant "$RELEVANT" '
            $relevant - ([to_entries[] | select(.key | endswith("_files")) | .value | fromjson] | add // [])
          ' <<<"$FILTER_OUTPUTS")
          echo "uncovered=$uncovered" >> "$GITHUB_OUTPUT"

  backend_app:
    name: Backend App Tests (Python)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend_app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CORS_ALLOWED_ORIGINS: "http://localhost"
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check app evaluation tests

      - name: Format check (ruff)
        run: uv run ruff format --check app evaluation tests

      - name: Type check (mypy)
        run: uv run mypy

      - name: Run app tests with coverage
        run: |
          mkdir -p test-results
          uv run pytest -q tests \
            --junitxml=test-results/pytest.xml \
            --cov=app \
            --cov-fail-under=80 \
            --cov-report=term-missing \
            --cov-report=xml:test-results/coverage.xml \
            --cov-report=html:test-results/htmlcov

      - name: Upload backend app test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-app-test-results
          path: |
            backend/test-results/pytest.xml
            backend/test-results/coverage.xml
            backend/test-results/htmlcov
          if-no-files-found: warn

  backend_evaluation:
    name: Backend Evaluation Tests (Python)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend_evaluation == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra evaluation

      - name: Lint (ruff)
        run: uv run ruff check app evaluation tests

      - name: Format check (ruff)
        run: uv run ruff format --check app evaluation tests

      - name: Type check (mypy)
        run: uv run mypy

      - name: Run evaluation tests with coverage
        run: |
          mkdir -p test-results
          uv run pytest -q evaluation/tests \
            --junitxml=test-results/pytest-evaluation.xml \
            --cov=evaluation \
            --cov-fail-under=80 \
            --cov-report=term-missing \
            --cov-report=xml:test-results/coverage-evaluation.xml \
            --cov-report=html:test-results/htmlcov-evaluation

      - name: Upload backend evaluation test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-evaluation-test-results
          path: |
            backend/test-results/pytest-evaluation.xml
            backend/test-results/coverage-evaluation.xml
            backend/test-results/htmlcov-evaluation
          if-no-files-found: warn

  pipeline_eval:
    name: Pipeline eval gate (gold set vs main)
    needs: changes
    # Disabled by the leading false; without it the gate runs on pull requests only, since it measures the PR against its base branch, and a gold-set-only PR has nothing to gate.
    if: false && github.event_name == 'pull_request' && needs.changes.outputs.pipeline_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    env:
      LLM_PROVIDER: mistral
      MISTRAL_API_KEY: ${{ secrets.EVAL_MISTRAL_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
      # Decided once, so both arms are traced or neither is.
      LANGFUSE_ON: ${{ secrets.LANGFUSE_PUBLIC_KEY != '' && secrets.LANGFUSE_SECRET_KEY != '' }}
      UV_CACHE_DIR: /tmp/.uv-cache
      # Both arms and the gate must sample the same set.
      EVAL_ARGS: --partition gold --limit 100 --seed 42
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RESULTS: ${{ github.workspace }}/eval-results
    steps:
      # The merge commit, so the PR is measured as it would land on main.
      - name: Checkout the PR
        uses: actions/checkout@v7
        with:
          path: pr

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: main

      # Arms sampled from different gold sets are not comparable, so a gold-set change must land in its own PR.
      - name: Require the gold set to change in its own PR
        env:
          GOLD_SET_CHANGED: ${{ needs.changes.outputs.gold_set }}
        run: |
          mkdir -p "$RESULTS"
          if [ "$GOLD_SET_CHANGED" = true ]; then
            printf '%s\n' '<!-- eval-gate -->' "### Puerta de evaluación para \`${HEAD_SHA::7}\`: ❌ falla" '' \
              'Esta PR cambia el gold set y también código del pipeline, así que main y la PR no se pueden comparar. Separa el cambio del gold set en su propia PR; la puerta sube el dataset nuevo a Langfuse en la siguiente PR del pipeline.' \
              > "$RESULTS/report.md"
            echo "::error::Separa el cambio del gold set en su propia PR."
            exit 1
          fi

      - name: Check the eval secret
        run: |
          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "::error::Falta el secreto EVAL_MISTRAL_API_KEY, así que la puerta de evaluación no puede medir la PR."
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "*/backend/uv.lock"

      # Reused across pushes to this PR and keyed by the Langfuse switch, since a checkpoint only resumes under its own run name.
      - name: Restore main's evaluation
        uses: actions/cache/restore@v6
        with:
          path: eval-results/main.jsonl
          key: pipeline-eval-main-${{ env.BASE_SHA }}-lf-${{ env.LANGFUSE_ON }}-${{ github.run_id }}
          restore-keys: pipeline-eval-main-${{ env.BASE_SHA }}-lf-${{ env.LANGFUSE_ON }}-

      # Idempotent, so the gold dataset holds main's gold set, including one a gold-set-only PR changed.
      - name: Upload the gold dataset to Langfuse
        if: env.LANGFUSE_ON == 'true'
        working-directory: main/backend
        run: uv run --frozen --extra evaluation python -m evaluation.upload_datasets gold-es

      - name: Evaluate main
        working-directory: main/backend
        run: |
          read -ra sample_args <<< "$EVAL_ARGS"
          lf=()
          if [ "$LANGFUSE_ON" = true ]; then lf=(--langfuse-run "ci-main-${BASE_SHA::7}-pr${PR_NUMBER}"); fi
          # A failed first pass only warns, since the second resumes whatever it left out and must succeed.
          uv run --frozen --extra evaluation python -m evaluation.evaluate_pipeline "${sample_args[@]}" \
            --checkpoint "$RESULTS/main.jsonl" "${lf[@]}" || echo "::warning::La primera pasada de main falló; se reanuda."
          uv run --frozen --extra evaluation python -m evaluation.evaluate_pipeline "${sample_args[@]}" \
            --checkpoint "$RESULTS/main.jsonl" "${lf[@]}"

      - name: Save main's evaluation
        if: always() && hashFiles('eval-results/main.jsonl') != ''
        uses: actions/cache/save@v6
        with:
          path: eval-results/main.jsonl
          key: pipeline-eval-main-${{ env.BASE_SHA }}-lf-${{ env.LANGFUSE_ON }}-${{ github.run_id }}

      # Replaying main's evidence leaves the PR's own change as the only difference between the arms.
      - name: Evaluate the PR on main's evidence
        working-directory: pr/backend
        run: |
          read -ra sample_args <<< "$EVAL_ARGS"
          lf=()
          if [ "$LANGFUSE_ON" = true ]; then lf=(--langfuse-run "ci-pr${PR_NUMBER}-${HEAD_SHA::7}-a${GITHUB_RUN_ATTEMPT}"); fi
          uv run --frozen --extra evaluation python -m evaluation.evaluate_pipeline "${sample_args[@]}" \
            --checkpoint "$RESULTS/pr.jsonl" --replay-evidence "$RESULTS/main.jsonl" "${lf[@]}" || echo "::warning::La primera pasada de la PR falló; se reanuda."
          uv run --frozen --extra evaluation python -m evaluation.evaluate_pipeline "${sample_args[@]}" \
            --checkpoint "$RESULTS/pr.jsonl" --replay-evidence "$RESULTS/main.jsonl" "${lf[@]}"

      - name: Gate the PR on main's metrics
        working-directory: pr/backend
        run: |
          read -ra sample_args <<< "$EVAL_ARGS"
          uv run --frozen --extra evaluation python -m evaluation.eval_gate "${sample_args[@]}" \
            --base "$RESULTS/main.jsonl" --head "$RESULTS/pr.jsonl" --report "$RESULTS/report.md" \
            --commit "${HEAD_SHA::7}"

      # The report names its commit and the required check holds the verdict, so a comment from an older push reads as old.
      - name: Post the report on the PR
        if: ${{ !cancelled() && hashFiles('eval-results/report.md') != '' }}
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat "$RESULTS/report.md" >> "$GITHUB_STEP_SUMMARY"
          # The gate edits its own earlier comment, found by its marker, instead of adding one per push.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- eval-gate -->")) | .id' | tail -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RESULTS/report.md" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RESULTS/report.md"
          fi

      - name: Upload the eval checkpoints
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-eval
          path: eval-results
          if-no-files-found: warn

  frontend:
    name: Frontend (Next.js)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Format check (prettier)
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder

  frontend_e2e:
    name: Frontend e2e (Playwright)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Clerk development instance, where the test user really signs in.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: warn

  api_contract:
    name: API contract (frontend types in sync)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend_app == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      CORS_ALLOWED_ORIGINS: "http://localhost"
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Dump OpenAPI schema
        working-directory: backend
        run: uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > "$RUNNER_TEMP/openapi.json"

      - name: Regenerate API types from schema
        working-directory: frontend
        run: pnpm exec openapi-typescript "$RUNNER_TEMP/openapi.json" -o src/types/api.d.ts

      - name: Verify committed types match the OpenAPI schema
        run: |
          git diff --exit-code -- frontend/src/types/api.d.ts || {
            echo "::error::frontend/src/types/api.d.ts is out of sync with the backend OpenAPI schema. Run 'pnpm --dir frontend generate:api-types' against a running backend and commit the result."
            exit 1
          }

  deploy_stack:
    name: Production stack (build, boot, deploy script)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy_config == 'true' || needs.changes.outputs.backend_image == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      # Dummy values for the variables docker-compose*.yml interpolates from the root .env.
      POSTGRES_PASSWORD: ci-postgres
      REDIS_PASSWORD: ci-redis
      # Well-formed but fake (base64 of "clerk.example.com$"), since Clerk parses the key at runtime.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      APP_DOMAIN: app.example.com
      API_DOMAIN: api.example.com
      ACME_EMAIL: ci@example.com
      # The production stack, as deploy.yml runs it; '-f docker-compose.yml' alone selects the base file.
      COMPOSE_FILE: docker-compose.yml:docker-compose.prod.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Check the deploy script (bash -n, shellcheck)
        run: |
          docker run --rm -v "$PWD:/workdir" mikefarah/yq:4.44.3 -e \
            '.jobs.deploy.steps[] | select(.uses == "appleboy/ssh-action*") | .with.script' \
            .github/workflows/deploy.yml > "$RUNNER_TEMP/deploy.sh"
          bash -n "$RUNNER_TEMP/deploy.sh"
          docker run --rm -v "$RUNNER_TEMP:/mnt" koalaman/shellcheck:v0.10.0 -s bash -S warning /mnt/deploy.sh

      - name: Write dummy env files
        run: |
          # Enough for validate_runtime to pass with ENVIRONMENT unset, as in production.
          cat > backend/.env <<'EOF'
          LLM_PROVIDER=mistral
          MISTRAL_API_KEY=ci-dummy
          CLERK_JWKS_URL=https://clerk.example.com/.well-known/jwks.json
          CLERK_ISSUER=https://clerk.example.com
          CLERK_AUDIENCE=ci
          CLERK_SECRET_KEY=sk_test_ci_placeholder
          CLERK_WEBHOOK_SECRET=whsec_ci_placeholder
          STRIPE_SECRET_KEY=sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET=whsec_ci_placeholder
          STRIPE_PRICE_PRO_MONTHLY=price_ci_monthly
          STRIPE_PRICE_PRO_YEARLY=price_ci_yearly
          RESEND_API_KEY=re_ci_placeholder
          RESEND_FROM_EMAIL=ci@example.com
          CONTACT_TO_EMAIL=ci@example.com
          EOF
          cat > frontend/.env <<'EOF'
          CLERK_SECRET_KEY=sk_test_ci_placeholder
          CLERK_TELEMETRY_DISABLED=1
          EOF

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml --profile ollama config --quiet
          docker compose config --quiet

      - name: Validate Caddyfile
        run: docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Bake reads the build sections of the compose files, so the images match what deploy.yml's 'up --build' makes.
      - name: Build images from the compose files
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            docker-compose.yml
            docker-compose.prod.yml
          targets: backend,frontend
          load: true
          set: |
            backend.cache-from=type=gha,scope=backend
            backend.cache-to=type=gha,mode=max,scope=backend
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,mode=max,scope=frontend

      - name: Start migrate, backend, worker and frontend with the production config
        run: docker compose up -d --no-build --wait --wait-timeout 300 backend worker frontend

      - name: Show service logs
        if: failure()
        run: docker compose logs --tail 100 migrate backend worker frontend

  ci_ok:
    name: CI passed
    needs:
      [
        changes,
        backend_app,
        backend_evaluation,
        pipeline_eval,
        frontend,
        frontend_e2e,
        api_contract,
        deploy_stack,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Algún job de CI falló o se canceló; no se despliega."
          exit 1

      - name: Fail if a deploy-relevant file matches no filter
        if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.uncovered != '[]'
        env:
          UNCOVERED: ${{ needs.changes.outputs.uncovered }}
        run: |
          echo "::error::Estos archivos llegan al despliegue pero ningún filtro de 'changes' los cubre, así que ningún job los probó. Añádelos al filtro del job que los ejercita, o a not_deployed si no se despliegan:"
          jq -r '.[]' <<<"$UNCOVERED"
          exit 1

      - name: Report
        run: echo "CI en verde. Los jobs no aplicables a este cambio se omitieron."
