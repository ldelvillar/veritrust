name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/veritrust
            git pull --ff-only
            # Backup before the 'migrate' service's migrations; on the first deploy there is no postgres yet.
            pg_cid=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q postgres)
            if [ -n "$pg_cid" ]; then
              mkdir -p ~/backups
              docker exec "$pg_cid" sh -c 'pg_dump -Fc -U "$POSTGRES_USER" "$POSTGRES_DB"' \
                > ~/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).dump
              # Keep the 10 most recent backups, since every push to main makes a full one.
              ls -1t ~/backups/pre-deploy-*.dump | tail -n +11 | xargs -r rm --
            fi
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build || {
              # If 'migrate' fails, its error only shows in its logs.
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 50 migrate
              exit 1
            }
            # Nothing depends on worker or frontend health, so 'up -d' returns even if they crash-loop.
            for svc in worker frontend; do
              echo "Esperando a que $svc pase su healthcheck..."
              status=""
              for _ in $(seq 60); do
                cid=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q "$svc")
                status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo desconocido)
                if [ "$status" = "healthy" ]; then break; fi
                sleep 5
              done
              if [ "$status" != "healthy" ]; then
                # Covers both failures, a crash loop ('unhealthy') and a hung start ('starting').
                echo "::error::$svc no llegó a healthy en 300s (estado: $status)"
                docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 50 "$svc"
                exit 1
              fi
              echo "$svc healthy"
            done
            docker image prune -f
            docker builder prune -f
