name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/veritrust
            git pull --ff-only
            # Renderiza .env desde Secret Manager (docs/deploy-secrets.md); si el
            # secreto no existe o su contenido no es plausible, conserva el .env actual.
            if gcloud secrets versions access latest --secret=veritrust-env > .env.tmp 2>/dev/null \
              && grep -q '^POSTGRES_PASSWORD=..*' .env.tmp \
              && grep -q '^REDIS_PASSWORD=..*' .env.tmp \
              && grep -q '^APP_DOMAIN=..*' .env.tmp; then
              mv .env.tmp .env
            else
              rm -f .env.tmp
              echo "Secret Manager: 'veritrust-env' no accesible o inválido; se mantiene el .env actual"
            fi
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            # Nadie hace depends_on del worker, así que 'up -d' vuelve aunque esté en crash-loop.
            echo "Esperando a que el worker pase su healthcheck..."
            status=""
            for _ in $(seq 60); do
              cid=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q worker)
              status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo desconocido)
              if [ "$status" = "healthy" ]; then break; fi
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              # Un crash-loop se queda en 'starting' para siempre: cada reinicio resetea el healthcheck.
              echo "::error::El worker no llegó a healthy en 300s (estado: $status)"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 50 worker
              exit 1
            fi
            echo "Worker healthy"
            docker image prune -f
            docker builder prune -f
