name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/veritrust
            git pull --ff-only
            # Renderiza .env desde Secret Manager (docs/deploy/secrets.md); si el
            # secreto no existe o su contenido no es plausible, conserva el .env actual.
            if gcloud secrets versions access latest --secret=veritrust-env > .env.tmp 2>/dev/null \
              && grep -q '^POSTGRES_PASSWORD=..*' .env.tmp \
              && grep -q '^REDIS_PASSWORD=..*' .env.tmp \
              && grep -q '^APP_DOMAIN=..*' .env.tmp; then
              mv .env.tmp .env
            else
              rm -f .env.tmp
              echo "Secret Manager: 'veritrust-env' no accesible o inválido; se mantiene el .env actual"
            fi
            # Copia previa a las migraciones del servicio 'migrate'; en el primer despliegue aún no hay postgres.
            pg_cid=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q postgres)
            if [ -n "$pg_cid" ]; then
              mkdir -p ~/backups
              docker exec "$pg_cid" sh -c 'pg_dump -Fc -U "$POSTGRES_USER" "$POSTGRES_DB"' \
                > ~/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).dump
              # Conserva las 10 copias más recientes: cada push a main genera una completa.
              ls -1t ~/backups/pre-deploy-*.dump | tail -n +11 | xargs -r rm --
            fi
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build || {
              # Si falla 'migrate', su error solo aparece en sus logs.
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 50 migrate
              exit 1
            }
            # Nadie depende de worker ni frontend por salud, así que 'up -d' vuelve aunque estén en crash-loop.
            for svc in worker frontend; do
              echo "Esperando a que $svc pase su healthcheck..."
              status=""
              for _ in $(seq 60); do
                cid=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q "$svc")
                status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo desconocido)
                if [ "$status" = "healthy" ]; then break; fi
                sleep 5
              done
              if [ "$status" != "healthy" ]; then
                # Cubre los dos fallos: crash-loop (reporta 'unhealthy') y arranque colgado ('starting').
                echo "::error::$svc no llegó a healthy en 300s (estado: $status)"
                docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 50 "$svc"
                exit 1
              fi
              echo "$svc healthy"
            done
            docker image prune -f
            docker builder prune -f
